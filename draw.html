<style>
/* 抽签页：沿用预约页的粉色 Y2K 外观，动物和弹窗是像素风 */
.dwrap{max-width:520px;margin:0 auto;padding-top:14px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.dhead img{width:110px;height:auto}
.dhead h1{margin:0;font:400 30px var(--f-head);color:var(--orange2);text-shadow:3px 3px 0 #FFD0E3}
.lang2 button{border:2px solid var(--orange2);background:#fff;color:var(--orange2);font:600 14px var(--f-num);padding:4px 10px;cursor:pointer}
.lang2 button[aria-pressed="true"]{background:var(--orange2);color:#fff}
.dnote{margin:0 0 12px;color:var(--muted);font-size:15px}
.or{margin:2px 0 8px;font-size:14px;color:var(--muted)}
.dbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.dbtns .go{flex:1}
.msg{margin:10px 0 0;color:var(--orange2);font-weight:600}
/* 抽到的那一刻 */
.stage{text-align:center;padding:6px 0 4px}
.bush{display:block;margin:6px auto 0;image-rendering:pixelated;animation:shake .5s steps(2) 3}
.got{display:none}
.got svg{display:block;margin:0 auto;image-rendering:pixelated;animation:popout .5s steps(5) both}
.got h3{margin:12px 0 2px;font:400 26px var(--f-head);color:var(--orange2);text-shadow:3px 3px 0 #FFD0E3}
.got p{margin:2px 0;color:var(--ink)}
.extra{display:inline-block;margin-top:8px;padding:4px 12px;background:#FFF2B3;color:#8A5A00;font-weight:600;
  box-shadow:0 -3px 0 #F2A900,0 3px 0 #F2A900,-3px 0 0 #F2A900,3px 0 0 #F2A900}
@keyframes shake{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes popout{0%{transform:translateY(30px) scale(.4);opacity:0}70%{transform:translateY(-6px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
/* 图鉴 */
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.slot{aspect-ratio:1;background:#fff;display:grid;place-items:center;padding:4px;box-shadow:0 0 0 2px var(--line)}
.slot svg{max-width:100%;max-height:100%;image-rendering:pixelated}
.slot.no svg{opacity:.9}
.count{margin:10px 0 0;text-align:center;color:var(--muted)}
.count b{color:var(--orange2);font:600 20px var(--f-num)}
/* 弹窗（与集卡预览同款） */
.pop{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(90,40,64,.28);z-index:20}
.pop[hidden]{display:none}
.pwin{width:min(340px,100%);background:#FFF5FA;animation:pop-in .4s steps(4) both;box-shadow:0 -3px 0 #C2457E,0 3px 0 #C2457E,-3px 0 0 #C2457E,3px 0 0 #C2457E,9px 9px 0 #F4A9CB}
.pbar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:repeating-linear-gradient(90deg,#F9C6DE 0 6px,#FBD3E6 6px 12px);border-bottom:3px solid #C2457E}
.pbar b{flex:1;font:600 15px var(--f-num);color:#C2457E}
.pbtns{display:flex;gap:4px}.pbtns i{width:18px;height:18px;background:#fff;box-shadow:0 0 0 2px #C2457E;display:grid;place-items:center;font:700 11px/1 var(--f-num);font-style:normal;color:#C2457E}
.pbody{position:relative;padding:20px 18px 18px;text-align:center}
.pheart{animation:hop .6s steps(2) .4s infinite;image-rendering:pixelated}
.pbody h3{margin:10px 0 4px;font:400 30px/1.2 var(--f-head);color:var(--orange2);text-shadow:3px 3px 0 #FFD0E3}
.pbody p{margin:0 0 16px;color:var(--muted);font-size:15px;line-height:1.6}
.pgo{border:0;padding:10px 26px;cursor:pointer;font:400 19px var(--f-head);color:#fff;background:linear-gradient(180deg,#FFA060,#F4511E 75%);
  box-shadow:0 -3px 0 #B8360C,0 3px 0 #B8360C,-3px 0 0 #B8360C,3px 0 0 #B8360C,0 6px 0 #B8360C,inset 0 3px 0 rgba(255,255,255,.45)}
.fpop{position:fixed;left:50%;top:18%;width:min(300px,92vw);transform:translateX(-50%);background:#F3F8E4;z-index:21;
  box-shadow:0 -3px 0 #2F5A2A,0 3px 0 #2F5A2A,-3px 0 0 #2F5A2A,3px 0 0 #2F5A2A,6px 6px 0 #8B5A2B,9px 9px 0 #A9D46A}
.fpop[hidden]{display:none}
.fbar{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 10px;background:repeating-linear-gradient(90deg,#6BAA4A 0 6px,#7DBB55 6px 12px);border-bottom:3px solid #2F5A2A}
.fbar b{flex:1;font:600 14px var(--f-num);color:#F3F8E4;text-shadow:2px 2px 0 #2F5A2A}
.fbar button{width:18px;height:18px;padding:0;border:0;background:#F3F8E4;box-shadow:0 0 0 2px #2F5A2A;font:700 11px/1 var(--f-num);color:#2F5A2A;cursor:pointer}
.fbody{position:relative;padding:14px 14px 0;text-align:center;overflow:hidden}
.fbody .tree{position:absolute;bottom:9px;image-rendering:pixelated}.fbody .tree.l{left:6px}.fbody .tree.r{right:6px}.fbody .shroom{position:absolute;bottom:9px;left:44px;image-rendering:pixelated}
.fsay{margin:4px 22px 8px;font:400 20px/1.45 var(--f-head);color:#2F5A2A}.fsay.fr{font:600 16px/1.5 var(--f-num)}
.fsay small{display:block;margin-top:4px;font:400 15px var(--f-head);color:#6B8F4E}
.grass{height:12px;margin:0 -14px;background:linear-gradient(90deg,transparent 0 3px,#6BAA4A 3px 6px,transparent 6px 12px,#3E7A3A 12px 15px,transparent 15px 18px) 0 0/18px 3px repeat-x,linear-gradient(#6BAA4A,#6BAA4A) 0 3px/100% 9px no-repeat}
.road{position:fixed;left:0;right:0;bottom:24px;height:100px;overflow:hidden;pointer-events:none;z-index:19}
.road[hidden]{display:none}
.parade{position:absolute;bottom:0;left:0;display:flex;align-items:flex-end;gap:10px}
.parade .w{position:relative;animation:bob .36s steps(1) infinite}.parade .w:nth-child(odd){animation-delay:-.18s}
.parade .w svg{display:block;image-rendering:pixelated}.parade .w svg+svg{position:absolute;left:0;bottom:0;opacity:0}
.parade .w.f2 svg{opacity:0}.parade .w.f2 svg+svg{opacity:1}
@keyframes pop-in{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes hop{50%{transform:translateY(-4px)}}
@keyframes bob{50%{transform:translateY(-2px)}}
/* 图鉴分区 + 头像 */
.bk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line)}.bk:last-of-type{border-bottom:0}.bk b{font:600 17px var(--f-num)}.bk small{display:block;color:var(--muted)}.bk .bkl{max-width:50%;text-align:right}.bkc.sure{background:var(--orange2);color:#fff}
.barlink{color:inherit;text-decoration:none}.barlink:hover{text-decoration:underline}
.gohome{text-align:center;margin:14px 0 0}.gohome .go{display:inline-block;text-decoration:none;font-size:17px;padding:10px 22px}
.sect .treeic{display:inline-block;vertical-align:-3px;margin-right:6px;image-rendering:pixelated}
.fairy,.spark{position:absolute;left:0;top:0;pointer-events:none;z-index:3}.fairy svg,.spark svg{display:block;image-rendering:pixelated}.fairy svg{opacity:.97}
.pz{margin-bottom:4px}.pzi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:8px;background:#FFF2B3;
  box-shadow:0 -3px 0 #F2A900,0 3px 0 #F2A900,-3px 0 0 #F2A900,3px 0 0 #F2A900}
.pzi b{font:600 16px var(--f-num);color:#8A5A00}.pzi small{display:block;color:#9A7A40;font-size:13px}
.pzs{flex:none;font:600 14px var(--f-num);color:#fff;background:var(--orange2);padding:3px 10px}
.pzbtn{flex:none;min-height:44px;max-width:46%;border:0;cursor:pointer;font:600 16px var(--f-num);color:#fff;background:var(--orange2);padding:8px 16px;margin:3px;box-shadow:0 -3px 0 #8A5A00,0 3px 0 #8A5A00,-3px 0 0 #8A5A00,3px 0 0 #8A5A00}
.pzbtn.sure{background:#C2457E;font-size:14px}.pzbtn:disabled{opacity:.6;cursor:default}
.pzmsg{margin:4px 0 8px;font-size:15px;color:#B8360C}.pzmsg.ok{color:#2F7A3A;font-weight:600}
.pzi.used,.pzi.expired{background:#F4F1F2;box-shadow:0 -3px 0 #DDD3D8,0 3px 0 #DDD3D8,-3px 0 0 #DDD3D8,3px 0 0 #DDD3D8}
.pzi.used b,.pzi.expired b{color:#A99AA2;text-decoration:line-through}.pzi.used small,.pzi.expired small{color:#B9AEB3}.pzi.used .pzs,.pzi.expired .pzs{background:#C9BEC4}
.pznote{margin:2px 0 6px;font-size:13px;color:var(--muted)}
.sect{margin:12px 0 6px;font:400 17px var(--f-head);color:var(--win-ink)}.sect.wsect{color:#3E78C4}
.album.winter{grid-template-columns:repeat(6,1fr)}.album.winter .slot{background:#F2F7FF;box-shadow:0 0 0 2px #A9C9EE}
.avrow{display:flex;align-items:center;gap:12px;margin-bottom:4px}.avrow b{display:block;font:400 20px var(--f-head);color:var(--ink)}.avrow small{color:var(--muted)}
.avcur{width:66px;height:66px;flex:none;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 3px var(--win-edge)}.avcur svg{max-width:60px;max-height:60px;image-rendering:pixelated}
.avpick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}.avlab{margin:10px 0 0;font-size:13px;color:var(--muted)}.avlab.win2{color:#3E78C4}.avopt.locked{cursor:default;opacity:.8}.avopt{padding:3px;border:0;background:#fff;cursor:pointer;box-shadow:0 0 0 2px var(--line)}.avopt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--orange2)}.avopt svg{display:block;image-rendering:pixelated}
/* 圣诞夜舞台 */
.wstage{position:fixed;left:50%;top:50%;width:min(760px,100vw);height:430px;transform:translate(-50%,-50%);z-index:22;overflow:hidden;background:linear-gradient(#2E3F6E,#5A6FA8 70%,#8FA6D6);box-shadow:0 0 0 3px #2A3550,0 0 0 100vmax rgba(42,53,80,.35)}
.wstage[hidden]{display:none}
.sky i{position:absolute;top:-6px;width:4px;height:4px;background:#fff;animation:snow linear infinite}.sky i:nth-child(3n){width:3px;height:3px;opacity:.8}
@keyframes snow{to{transform:translate(-20px,440px)}}
.sleigh{position:absolute;top:0;left:0;z-index:2;display:flex;align-items:flex-end;gap:2px}.sleigh svg{display:block;image-rendering:pixelated}.sleigh .rope{width:16px;height:3px;background:#F2C14E;margin-bottom:26px}
.sleigh .deer{position:relative;animation:bob .36s steps(1) infinite}.sleigh .deer svg+svg{position:absolute;left:0;bottom:0;opacity:0}.sleigh .deer.f2 svg{opacity:0}.sleigh .deer.f2 svg+svg{opacity:1}
.gifts{position:absolute;inset:0;z-index:1;pointer-events:none}.gifts svg{position:absolute;image-rendering:pixelated}
.ground{position:absolute;left:0;right:0;bottom:0;height:86px;background:#F7FBFF;box-shadow:0 -3px 0 #DDE9F7}
.ground>span{position:absolute;bottom:20px;display:block}.ground svg{display:block;image-rendering:pixelated}.tree-c{left:50%;margin-left:-40px;z-index:2}
.tree-c svg+svg{position:absolute;left:0;bottom:0;opacity:0}.tree-c.f2 svg{opacity:0}.tree-c.f2 svg+svg{opacity:1}
.hop svg{animation:hop .7s steps(2) infinite}.hop.h2 svg{animation-delay:-.35s}
.wpop{position:absolute;left:0;right:0;margin:0 auto;top:150px;width:min(290px,90%);background:#F2F7FF;z-index:3;box-shadow:0 -3px 0 #2A3550,0 3px 0 #2A3550,-3px 0 0 #2A3550,3px 0 0 #2A3550,6px 6px 0 #A9C9EE,9px 9px 0 #FFFFFF}
.wpop[hidden]{display:none}
.wbar{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 10px;background:repeating-linear-gradient(90deg,#A9C9EE 0 6px,#C3DBF5 6px 12px);border-bottom:3px solid #2A3550}
.wbar b{flex:1;font:600 14px var(--f-num);color:#2A3550}.wbar button{width:18px;height:18px;padding:0;border:0;background:#fff;box-shadow:0 0 0 2px #2A3550;font:700 11px/1 var(--f-num);color:#2A3550;cursor:pointer}
.wbody{padding:12px 14px 14px;text-align:center}.wsay{margin:0;font:400 20px/1.45 var(--f-head);color:#2A3550}.wsay.fr{font:600 16px/1.5 var(--f-num)}
.wsay small{display:block;margin-top:6px;font:400 22px/1 -apple-system,"Apple Color Emoji",sans-serif;letter-spacing:1px}
@media (prefers-reduced-motion:reduce){.bush,.got svg,.pwin,.pheart,.parade .w,.sky i,.hop svg{animation:none}}
</style>

  /* 一路撒星星 */
  const trail = setInterval(() => { const fr = f.getBoundingClientRect(); const s = star(fr.left - br.left + fw / 2, fr.top - br.top + fh, 2);
    s.animate([{opacity: 1, transform: 'translateY(0)'}, {opacity: 0, transform: 'translateY(14px)'}], {duration: 700, easing: 'steps(4)', fill: 'forwards'}); setTimeout(() => s.remove(), 750); }, 110);
  /* 施魔法：礼物闪一下，八颗星星炸开，小精灵消失 */
  setTimeout(() => {
    clearInterval(trail);
    gift.animate([{filter: 'brightness(1)'}, {filter: 'brightness(1.8) drop-shadow(0 0 8px #FFD84D)'}, {filter: 'brightness(1)'}], {duration: 700, easing: 'steps(4)'});
    for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2, s = star(cx, cy, 3);
      s.animate([{transform: 'translate(0,0)', opacity: 1}, {transform: `translate(${Math.cos(a) * 80}px,${Math.sin(a) * 60}px)`, opacity: 0}], {duration: 900, easing: 'steps(6)', fill: 'forwards'}); setTimeout(() => s.remove(), 950); }
    f.animate([{opacity: 1}, {opacity: 1, offset: .4}, {opacity: 0}], {duration: 900, easing: 'steps(5)', fill: 'forwards'});
    setTimeout(() => f.remove(), 950);
  }, 4300);
}

/* 弹窗：任意 10 样 → 免费；常规 10 只集齐 → 游行 + 森林弹窗 */
function showFree() {
  $('pheart').innerHTML = PX(['.OO.OO.', 'OhHOHHO', 'OHHHHHO', '.OHHHO.', '..OHO..', '...O...'], {O: '#3B2C2A', H: '#F4511E', h: '#FFD0A0'}, 'pheart', 9);
  $('popT').textContent = t().freeT; $('popP').innerHTML = t().freeP; $('popOk').textContent = t().ok;
  $('pop').hidden = false; $('popOk').focus();
}
function parade() {
  const TREE = ['...OO...', '..OggO..', '.OgGggO.', '..OggO..', '.OgggGO.', 'OgGgggGO', '.OOttOO.', '...tt...'], TP = {O: '#2F5A2A', g: '#6BAA4A', G: '#A9D46A', t: '#7A4E2D'};
  $('ftrees').innerHTML = PX(TREE, TP, 'tree l', 3) + PX(TREE, TP, 'tree r', 3) + PX(['.OOOO.', 'OrwrrO', 'OrrrwO', '.OccO.', '..cc..'], {O: '#3B2C2A', r: '#E5513A', w: '#FFF4E2', c: '#F3E6CC'}, 'shroom', 3);
  $('fsay').className = 'fsay' + (lang === 'fr' ? ' fr' : ''); $('fsay').innerHTML = t().fsay + '<small>' + t().fsub + '</small>';
  const pa = $('pa'), road = $('road');
  pa.innerHTML = PIPI_ANIMALS.map((a, i) => `<div class="w${i % 2 ? ' f2' : ''}">${PX(a.walk[0], a.pal, '', 3)}${PX(a.walk[1], a.pal, '', 3)}</div>`).join('');
  road.hidden = false;
  const tick = setInterval(() => pa.querySelectorAll('.w').forEach(w => w.classList.toggle('f2')), 180);
  const from = road.clientWidth, to = -pa.scrollWidth;
  const an = pa.animate([{transform: `translateX(${from}px)`}, {transform: `translateX(${to}px)`}], {duration: (from - to) / 70 * 1000, easing: 'linear', fill: 'forwards'});
  setTimeout(() => { $('fpop').hidden = false; }, 1500);
  an.finished.then(() => { clearInterval(tick); road.hidden = true; });
}

/* 集齐冬日 6 样：圣诞夜（下雪、雪橇从右上角斜飞出画并丢礼物、大家绕圣诞树转圈）+ snow.exe 弹窗 */
function xmasNight() {
  const W = Object.fromEntries(PIPI_WINTER.map(a => [a.key, a])), st = $('ws');
  $('wsay').className = 'wsay' + (lang === 'fr' ? ' fr' : ''); $('wsay').innerHTML = t().wsay + '<small>' + t().wsub + '</small>';
  $('sky').innerHTML = Array.from({length: 46}, () => `<i style="left:${Math.random() * 104}%;animation-duration:${3 + Math.random() * 4}s;animation-delay:${-Math.random() * 7}s"></i>`).join('');
  const SLEIGH = ['OO..................', 'OrO.................', 'OrrO................', 'OrrrOOOOOOOOOOOOOOOO', 'OrrrrrrrrrrrrrrrrrrO', 'ORrrrrgggggggggrrrRO', '.ORRRRRRRRRRRRRRRRO.', '..OyO..........OyO..', 'yyyyyyyyyyyyyyyyyyyy'];
  const deer = d => `<span class="deer${d ? ' f2' : ''}">${PX(W.reindeer.walk[0], W.reindeer.pal, '', 3)}${PX(W.reindeer.walk[1], W.reindeer.pal, '', 3)}</span>`;
  $('sleigh').innerHTML = deer(0) + deer(1) + '<span class="rope"></span><span style="position:relative">' + PX(W.santa.rows, W.santa.pal, '', 3).replace('<svg ', '<svg style="position:absolute;left:12px;bottom:12px" ') + PX(SLEIGH, {O: '#3B2C2A', r: '#D9362F', R: '#A82525', g: '#F2C14E', y: '#F2C14E'}, '', 3) + '</span>';
  $('g-tree').innerHTML = PX(W.xmastree.rows, W.xmastree.pal, '', 5) + PX(W.xmastree.rows, {...W.xmastree.pal, r: '#FFD84D', y: '#E5413A', G: '#FFFFFF'}, '', 5);
  $('g-snow').innerHTML = PX(W.snowman.rows, W.snowman.pal, '', 4);
  $('g-bear').innerHTML = PX(W.polarbear.rows, W.polarbear.pal, '', 3);
  $('g-ginger').innerHTML = PX(W.ginger.rows, W.ginger.pal, '', 3);
  $('gifts').innerHTML = ''; st.hidden = false; $('wpop').hidden = true;
  const sl = $('sleigh'), gifts = $('gifts');
  const blink = setInterval(() => document.querySelectorAll('#ws .deer, #g-tree').forEach(e => e.classList.toggle('f2')), 400);
  sl.animate([{transform: `translate(${st.clientWidth}px,-50px)`}, {transform: `translate(${-sl.scrollWidth - 20}px,90px)`}], {duration: 7000, easing: 'linear', fill: 'forwards'});
  const GIFT = ['..y.y..', '...y...', 'OOOyOOO', 'OccyccO', 'OyyyyyO', 'OccyccO', 'OOOOOOO'], GC = ['#E5413A', '#3E8EDE', '#43A85A', '#EF84AE', '#8A5CC9'];
  const drop = setInterval(() => {
    const sr = st.getBoundingClientRect(), r = sl.getBoundingClientRect(), x = r.left - sr.left + r.width * 0.75 + (Math.random() * 20 - 10), y = r.top - sr.top + r.height * 0.6;
    if (x < -20 || x > sr.width) return;
    const d = document.createElement('div'); d.innerHTML = PX(GIFT, {O: '#3B2C2A', c: GC[Math.floor(Math.random() * GC.length)], y: '#F2C14E'}, '', 3);
    const g = d.firstElementChild; g.style.left = x + 'px'; g.style.top = y + 'px'; gifts.appendChild(g);
    g.animate([{transform: 'translateY(0) rotate(-10deg)'}, {transform: `translateY(${sr.height - 86 + 8 + Math.random() * 30 - y}px) rotate(8deg)`}], {duration: 900 + Math.random() * 300, easing: 'steps(8)', fill: 'forwards'});
  }, 380);
  setTimeout(() => clearInterval(drop), 7000);
  const ORB = [['g-snow', 0], ['g-bear', 2.1], ['g-ginger', 4.2]]; let run = true;
  (function orbit(ts) { if (!run) return; const gw = $('ground').clientWidth, cx = gw / 2, rx = Math.min(150, gw * 0.36);
    ORB.forEach(([id, ph]) => { const el = $(id), a = ts / 1000 * 1.05 + ph; el.style.left = (cx + Math.cos(a) * rx - el.offsetWidth / 2) + 'px'; el.style.bottom = (20 + Math.sin(a) * 16) + 'px'; el.style.zIndex = Math.sin(a) < 0 ? 3 : 1; });
    requestAnimationFrame(orbit); })(0);
  setTimeout(() => { $('wpop').hidden = false; }, 1500);
  window.closeXmas = () => { run = false; clearInterval(blink); clearInterval(drop); st.hidden = true; };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; try { localStorage.setItem('pipi-lang', lang); } catch (x) {} renderForm(); return; }
  if (b.id === 'drawBtn' && !busy) doDraw();
  if (b.id === 'lookBtn') doLook();
  if (b.id === 'popOk') $('pop').hidden = true;
  if (b.id === 'fclose') $('fpop').hidden = true;
  if (b.id === 'wclose' && window.closeXmas) window.closeXmas();
  if (b.dataset.av) pickAvatar(b.dataset.av);
  if (b.dataset.bk) cancelBk(b.dataset.bk);
  if (b.dataset.pz) redeemPz(b.dataset.pz);
});
renderForm();
if (!code && me.name && (me.phone || me.email)) doLook();
</script>
